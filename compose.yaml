services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aitusa
      POSTGRES_USER: aitusa
      POSTGRES_PASSWORD: aitusa
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitusa -d aitusa"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migration
    environment:
      DATABASE_URL: postgresql://aitusa:aitusa@db:5432/aitusa?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: "3001"
      DATABASE_URL: postgresql://aitusa:aitusa@db:5432/aitusa?schema=public
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${API_PORT:-3001}:3001"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:3001
        NEXT_PUBLIC_AITUSA_TELEGRAM_CONTACT: ${NEXT_PUBLIC_AITUSA_TELEGRAM_CONTACT:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM: ${NEXT_PUBLIC_AITUSA_TELEGRAM:-}
        NEXT_PUBLIC_AITUSA_INSTAGRAM: ${NEXT_PUBLIC_AITUSA_INSTAGRAM:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM_SOCIAL_LEAD: ${NEXT_PUBLIC_AITUSA_TELEGRAM_SOCIAL_LEAD:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM_MEDIA_LEAD: ${NEXT_PUBLIC_AITUSA_TELEGRAM_MEDIA_LEAD:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM_CULTURE_LEAD: ${NEXT_PUBLIC_AITUSA_TELEGRAM_CULTURE_LEAD:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM_EXTERNAL_RELATIONS_LEAD: ${NEXT_PUBLIC_AITUSA_TELEGRAM_EXTERNAL_RELATIONS_LEAD:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM_ACADEMIC_LEAD: ${NEXT_PUBLIC_AITUSA_TELEGRAM_ACADEMIC_LEAD:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM_DIGITAL_LEAD: ${NEXT_PUBLIC_AITUSA_TELEGRAM_DIGITAL_LEAD:-}
        NEXT_PUBLIC_AITUSA_TELEGRAM_SCIENCE_LEAD: ${NEXT_PUBLIC_AITUSA_TELEGRAM_SCIENCE_LEAD:-}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  postgres_data:
